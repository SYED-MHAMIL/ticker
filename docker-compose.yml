services:
  server:
    build:
      context: .
    command: npm start
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
         condition: service_healthy
      rabbitMQ:
         condition: service_healthy


  postgres:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ticketprime
      POSTGRES_PASSWORD: mhamil
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
  rabbitMQ:
    image: rabbitmq:management
    hostname: my-rabbit
    container_name: some-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "8080:15672"
      - "5673:5672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5
      
  consumer:
    build:
      context: .
    command: npm run consumer
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
         condition: service_healthy
      rabbitMQ:
         condition: service_healthy
